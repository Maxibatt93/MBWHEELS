<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Motociclismo | MB Wheels</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #111;
      --bg-card: #1a1a1a;
      --green-main: #7bc043;
      --green-soft: #9be15d;
      --text-main: #fff;
      --text-muted: #ccc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-main);
      font-family: 'Poppins', sans-serif;
      color: var(--text-main);
    }

    a { text-decoration: none; color: inherit; }

    /* ===== BOTÓN VOLVER ===== */
    .btn-volver {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 10px 14px;
      border-radius: 30px;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .btn-volver:hover {
      background: var(--green-main);
      color: #000;
      transform: translateY(-2px);
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      height: 440px;
      overflow: hidden;
    }

    .hero img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero-logo {
      width: 180px;
      margin-bottom: 20px;
    }

    .hero-logo img {
      width: 100%;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 6px;
    }

    .hero p {
      font-size: 16px;
      color: var(--text-muted);
    }

    /* ===== TRANSICIÓN ===== */
    .hero-divider {
      height: 90px;
      background: linear-gradient(to bottom, rgba(0,0,0,0), #111);
    }

    /* ===== CATEGORÍAS ===== */
    .categorias {
      max-width: 1100px;
      margin: 20px auto 80px;
      padding: 0 40px;
    }

    .categorias h2 {
      text-align: center;
      color: var(--green-main);
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.6);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card h3 {
      margin: 16px 0 18px;
      font-size: 17px;
      color: var(--green-main);
    }
  </style>
</head>

<body>

  <!-- BOTÓN VOLVER -->
  <a href="#" onclick="history.back()" class="btn-volver">← Volver</a>

  <!-- HERO -->
  <section class="hero">
    <img src="img/banner.jpg" alt="Motociclismo MB Wheels" class="bg">
    <div class="overlay"></div>

    <div class="hero-content">
      <div class="hero-logo">
        <img src="img/logo-mbwheels.png" alt="MB Wheels">
      </div>
      <h1>Motociclismo</h1>
      <p>Accesorios, indumentaria y equipamiento para tu moto</p>
    </div>
  </section>

  <div class="hero-divider"></div>

  <!-- CATEGORÍAS -->
  <section class="categorias">
    <h2>Categorías</h2>

    <div class="grid">

      <a href="cascos.html" class="card">
        <img src="img/moto-cascos.jpg" alt="Cascos">
        <h3>Cascos</h3>
      </a>

      <a href="camperas.html" class="card">
        <img src="img/moto-camperas.jpg" alt="Camperas">
        <h3>Camperas</h3>
      </a>

      <a href="pantalones.html" class="card">
        <img src="img/moto-pantalones.jpg" alt="Pantalones">
        <h3>Pantalones</h3>
      </a>

      <a href="guantes.html" class="card">
        <img src="img/moto-guantes.jpg" alt="Guantes">
        <h3>Guantes</h3>
      </a>

      <a href="botas.html" class="card">
        <img src="img/moto-botas.jpg" alt="Botas">
        <h3>Botas</h3>
      </a>

      <a href="baules.html" class="card">
        <img src="img/moto-baules.jpg" alt="Baúles">
        <h3>Baúles</h3>
      </a>

      <a href="tensores.html" class="card">
        <img src="img/moto-tensores.jpg" alt="Tensores">
        <h3>Tensores</h3>
      </a>

      <a href="soportes-gps.html" class="card">
        <img src="img/moto-gps.jpg" alt="Soportes GPS">
        <h3>Soportes GPS</h3>
      </a>

      <a href="carplay.html" class="card">
        <img src="img/moto-carplay.jpg" alt="Car Play">
        <h3>Car Play</h3>
      </a>

    </div>
  </section>

</body>
</html>
