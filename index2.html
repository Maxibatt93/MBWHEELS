<!DOCTYPE html>
<html lang8"><html lang="es">
  <title>MB Wheels</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #111;
      --green-main: #7bc043;
      --text-main: #fff;
      --text-muted: #ccc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-main);
      font-family: 'Poppins', sans-serif;
      color: var(--text-main);
      padding-top: 44px;
    }

    a { text-decoration: none; color: inherit; }

    /* ===== HEADER TRANSLÚCIDO ===== */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 44px;
      z-index: 1200;

      display: flex;
      align-items: center;

      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      border-bottom: 1px solid rgba(255,255,255,0.25);

      opacity: 0;
      transform: translateY(-100%);
      transition: opacity .35s ease, transform .35s ease;
    }

    .site-header.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .header-left {
      position: absolute;
      left: 14px;
      display: flex;
      gap: 10px;
    }

    .header-btn {
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 12px;
      transition: 0.3s;
    }

    .header-btn:hover {
      background: var(--green-main);
      color: #000;
      transform: translateY(-1px);
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      height: 520px;
      overflow: hidden;
    }

    .hero img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero-logo {
      width: 180px;
      margin-bottom: 20px;
    }

    .hero-logo img {
      width: 100%;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      max-width: 580px;
      margin-bottom: 30px;
      color: var(--text-muted);
    }

    .hero-buttons {
      display: flex;
      gap: 20px;
    }

    .btn {
      padding: 14px 34px;
      border-radius: 40px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-outline {
      border: 2px solid #fff;
    }

    .btn-solid {
      background: var(--green-main);
      color: #000;
    }

    /* ===== CINTA DE NOVEDADES ===== */
    .news-ribbon {
      width: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, #111, #0d0d0d);
      padding: 16px 0;
    }

    .news-track {
      display: flex;
      gap: 14px;
      width: max-content;
      animation: scrollNews 28s linear infinite;
    }

    .news-ribbon:hover .news-track {
      animation-play-state: paused;
    }

    .news-pill {
      padding: 10px 18px;
      border-radius: 30px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: 0.3s;
    }

    .news-pill:hover {
      background: var(--green-main);
      color: #000;
      transform: translateY(-2px);
    }

    @keyframes scrollNews {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="site-header" id="siteHeader">
  <div class="header-left" id="header-buttons"></div>
</header>

<!-- HERO -->
<section class="hero">
  <img src="img/banner.jpg" class="bg" alt="">
  <div class="overlay"></div>

  <div class="hero-content">
    <div class="hero-logo">
      <img src="img/logo-mbwheels.png" alt="MB Wheels">
    </div>

    <h1>Todo sobre las dos ruedas</h1>
    <p>Equipamiento, indumentaria y accesorios para ciclismo y motociclismo</p>

    <div class="hero-buttons">
      <a href="ciclismo.html" class="btn btn-outline">Ciclismo</a>
      <a href="motociclismo.html" class="btn btn-solid">Motociclismo</a>
    </div>
  </div>
</section>

<!-- CINTA DE NOVEDADES -->
<section class="news-ribbon">
  <div class="news-track">

    <a href="ofertas.html" class="news-pill">🔥 Ofertas</a>
    <a href="novedades.html" class="news-pill">🆕 Novedades</a>
    <a href="liquidacion.html" class="news-pill">💥 Liquidación</a>
    <a href="cascos.html" class="news-pill">🪖 Cascos destacados</a>
    <a href="motociclismo.html" class="news-pill">🏍️ Motociclismo</a>
    <a href="ciclismo.html" class="news-pill">🚴 Ciclismo</a>

    <!-- duplicado para loop infinito -->
    <a href="ofertas.html" class="news-pill">🔥 Ofertas</a>
    <a href="novedades.html" class="news-pill">🆕 Novedades</a>
    <a href="liquidacion.html" class="news-pill">💥 Liquidación</a>
    <a href="cascos.html" class="news-pill">🪖 Cascos destacados</a>
    <a href="motociclismo.html" class="news-pill">🏍️ Motociclismo</a>
    <a href="ciclismo.html" class="news-pill">🚴 Ciclismo</a>

  </div>
</section>

<!-- JS HEADER SCROLL -->
<script>
  const header = document.getElementById("siteHeader");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 80) {
      header.classList.add("visible");
    } else {
      header.classList.remove("visible");
    }
  });
</script>

</body>
</html>
